version: 2

updates:
  # GitHub Actions — keep action versions patched
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - dependencies
      - security

  # Python app dependencies
  - package-ecosystem: pip
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  # Docker base images
  - package-ecosystem: docker
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels:
      - dependencies
      - docker
