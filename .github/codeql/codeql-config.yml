name: "Secure CI/CD — CodeQL Config"

# Use the security-extended query suite (includes security-and-quality)
queries:
  - uses: security-extended
  - uses: security-and-quality

# Scope analysis to the application source only
paths:
  - app

# Exclude tests, vendored code, and generated files
paths-ignore:
  - "**/*_test.py"
  - "**/test_*.py"
  - "**/tests/**"
  - "**/vendor/**"
  - "**/.venv/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"

# Pull Request alert thresholds
# error   → blocks merge
# warning → visible in Security tab, does not block
query-filters:
  - exclude:
      problem.severity: recommendation   # suppress style suggestions

# Language-specific packs
packs:
  python:
    - codeql/python-queries
